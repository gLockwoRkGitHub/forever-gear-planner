name: Update item data

# Weekly: rebuild data/items.js from the newest WoW Forever game tables, QuestieDB and
# Wowhead tooltips, commit it, then rebuild the page and the in-game addon. The weekly commit also keeps the
# repository active, so GitHub does not pause the scheduled workflows.
on:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: items
  cancel-in-progress: false

jobs:
  items:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Restore tooltip cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/tooltips
            .cache/npcs
          key: tooltips-${{ github.run_id }}
          restore-keys: tooltips-

      - name: Build item data
        run: python scripts/build_items.py

      - name: Commit item data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.js data/items-meta.json data/mechanics.json data/quests.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update item data"
            git push
          fi

      - name: Rebuild the page and the addon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --ref main
          gh workflow run addon.yml --ref main
